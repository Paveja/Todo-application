revolte:
  version: '1'
  project: sample-project
  appName: sample-app
  env:
    preview:
      services:
        rid_1:
          name: prev
          type: WEB_SERVICE
          entryPoint: src/app/page.tsx
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            port: 8080
            health: /health
            loadBalancerMode: shared
    qa:
      branch: qa
      services:
        rid_1:
          name: prev
          type: WEB_SERVICE
          entryPoint: src/app/page.tsx
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            port: 8080
            health: /health
            loadBalancerMode: shared
    staging:
      branch: staging
      services:
        rid_1:
          name: prev
          type: WEB_SERVICE
          entryPoint: src/app/page.tsx
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            port: 8080
            health: /health
            loadBalancerMode: shared
    production:
      branch: main
      services:
        rid_1:
          name: prev
          type: WEB_SERVICE
          entryPoint: src/app/page.tsx
          specifications:
            cpu: 2
            memory: 2
            storage: 50
            autoScaling:
              replica:
                min: 1
                max: 3
          properties:
            port: 8080
            health: /health
            loadBalancerMode: shared
